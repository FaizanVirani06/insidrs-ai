# Parameters for the research pipeline. Every number that affects a result lives here.

paths:
  data_dir: research/data        # raw extracts + analysis table (git-ignored)
  output_dir: research/output    # result tables and plots (git-ignored)

# --- Price source --------------------------------------------------------------
# db       = production's issuer_prices_daily (stops May 2026, many bad ticks)
# yfinance = research/fetch_prices.py download (run that first)
price_source: yfinance
yfinance:
  start: "2009-01-01"
benchmark: SPY                   # headline benchmark
small_cap_benchmark: IWM         # Russell 2000 ETF, used as a robustness check

# --- Return construction -----------------------------------------------------
horizons: [60, 180]              # trading days held
# next_day = enter at the close of the first trading day AFTER the filing date.
# Most Form 4s are accepted after the market close, so the filing-day close
# (what production uses) was often not a price you could have traded at.
entry: next_day                  # next_day | same_day
max_entry_gap_days: 7            # no price within this many calendar days of filing -> no entry
# A price series that stops this many days before the newest price in the whole
# database is treated as delisted/acquired: the position exits at its last price
# instead of being dropped (dropping it would be survivorship bias).
delist_gap_days: 10
# Daily moves beyond these are treated as likely split/adjustment errors and
# the event is flagged (not dropped) if one falls inside its holding window.
suspect_daily_up: 1.5
suspect_daily_down: -0.6

# --- Which rows count as a qualifying trade ------------------------------------
filters:
  min_dollars: 5000              # ignore token purchases
  max_dollars: 1000000000        # larger amounts are parse errors (shares x price blow-ups) or not open-market buys
  min_trade_price: 1.0           # reported transaction price; proxy for penny stocks
  max_trade_price: 10000         # above this the reported price is almost always a parse error
  max_filing_delay_days: 365     # e.g. a 2017 trade first reported in 2024: not news about the present
  exclude_amendments: true       # Form 4/A restates an earlier filing
  exclude_duplicates: true
  exclude_suspect_prices: true

# --- Point-in-time features -----------------------------------------------------
cluster_window_days: 14          # other insiders' buys FILED in the prior N days

# --- AI ratings: live vs backfilled (classified by the server clock) -----------
ratings:
  live_max_lag_days: 7           # rated within N days of the filing = live (a real forecast)
  backfill_min_lag_days: 90      # rated more than N days after = backfill (60-day outcome already known)
  model_knowledge_cutoff: "2025-01-31"   # Gemini 2.5; earlier filings may be in its training data

# --- Analysis -------------------------------------------------------------------
analysis:
  n_boot: 1000                   # bootstrap resamples for confidence intervals
  train_end: "2017-12-31"        # tune on filings up to here, test on everything after (never shuffle)
  model_train_end: "2021-12-31"  # Q3 models: fit on filings up to here, score on later ones

# --- Trading costs (ASSUMPTIONS, not measurements) -------------------------------
# Round-trip cost (spread + impact, buy and later sell) by the stock's typical
# daily dollar volume before entry. Rough retail-size figures; change them freely.
costs:
  round_trip_by_daily_volume:
    - {max_usd: 100000,    label: "under $100K/day",  cost: 0.05}
    - {max_usd: 1000000,   label: "$100K-$1M/day",    cost: 0.02}
    - {max_usd: 10000000,  label: "$1M-$10M/day",     cost: 0.01}
    - {max_usd: null,      label: "over $10M/day",    cost: 0.003}
